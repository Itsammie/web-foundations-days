<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 4 - Note Editor</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <button id="theme-toggle">Dark mode</button>
  </header>

  <main>
    <label for="note-text">Your Note:</label>
    <textarea id="note-text" rows="10" placeholder="Start typing..."></textarea>
    
    <div class="counters">
      <p id="char-count">0 / 200 characters</p>
      <p id="word-count">0 words</p>
    </div>

    <button id="clear-btn">Clear</button>
  </main>
</body>
</html>
